name: little-oogway-tokenspace-dev
services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_DB: tokenspace_v2_dev
      POSTGRES_USER: tokenspace_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["dev_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenspace_dev -d tokenspace_v2_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  dev_data:
    name: little-oogway-tokenspace-dev-data
