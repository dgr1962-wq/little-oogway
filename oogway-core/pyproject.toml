[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "little-oogway-core"
version = "0.1.0"
description = "Model-neutral conversation runtime and TokenSpace persistence for Little Oogway"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
workbench = [
  "beautifulsoup4>=4.12,<5",
  "ebooklib>=0.19,<1",
  "faster-whisper>=1.2,<2",
  "odfpy>=1.4,<2",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "pillow>=11,<13",
  "py7zr>=1.0,<2",
  "pypdf>=6,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "rapidocr-onnxruntime>=1.4,<2",
]

[project.scripts]
oogway-chat = "oogway_core.cli:main"
oogway-memory = "oogway_core.memory_cli:main"
oogway-public-retrieval = "oogway_core.public_retrieval_api:main"
oogway-operator = "oogway_core.operator_api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
