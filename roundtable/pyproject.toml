[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "little-oogway-roundtable"
version = "0.1.0"
description = "Deterministic local roundtable controller for model participants"
requires-python = ">=3.10"
dependencies = ["playwright>=1.55,<2"]

[project.scripts]
oogway-roundtable = "roundtable.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
